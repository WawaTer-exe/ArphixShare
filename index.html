<!DOCTYPE html>
<html>
<head>
<title>YouTube - ArphixShare</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #e6e6e6;
}

/* TOP BAR */
.topbar {
  background: white;
  border-bottom: 1px solid #ccc;
  padding: 6px 10px;
  display: flex;
  align-items: center;
}

.logo {
  color: red;
  font-size: 28px;
  font-weight: bold;
  margin-right: 20px;
}

.topbar input {
  width: 300px;
  padding: 4px;
}

.topbar button {
  margin-left: 5px;
  padding: 4px 8px;
}

/* LAYOUT */
.layout {
  display: table;
  width: 100%;
}

/* SIDEBAR */
.sidebar {
  display: table-cell;
  width: 180px;
  background: #f5f5f5;
  padding: 10px;
  vertical-align: top;
  border-right: 1px solid #ccc;
}

.sidebar a {
  display: block;
  padding: 6px 0;
  color: black;
  text-decoration: none;
  font-size: 13px;
}

/* MAIN */
.main {
  display: table-cell;
  padding: 15px;
}

/* VIDEO CARDS */
.video-grid {
  display: flex;
  flex-wrap: wrap;
}

.video {
  width: 200px;
  background: white;
  border: 1px solid #ccc;
  margin: 10px;
  padding: 5px;
  text-decoration: none;
  color: black;
}

.video img {
  width: 100%;
  height: 120px;
  object-fit: cover;
}

.title {
  font-size: 13px;
  margin-top: 4px;
}

.meta {
  font-size: 11px;
  color: gray;
}
</style>

</head>

<body>

<div class="topbar">
  <div class="logo">YouTube</div>
  <input placeholder="Search">
  <button>Search</button>
  <button>Upload</button>
</div>

<div class="layout">

  <div class="sidebar">
    <a href="#">Home</a>
    <a href="#">Trending</a>
    <a href="#">Subscriptions</a>
    <a href="#">History</a>
  </div>

  <div class="main">

    <h3>Featured Videos</h3>

    <div class="video-grid">

      <a class="video" href="video1.html">
        <img src="assets/thumbs/video1.jpg">
        <div class="title">Epic Gameplay Montage</div>
        <div class="meta">1,204 views</div>
      </a>

      <a class="video" href="video2.html">
        <img src="assets/thumbs/video2.jpg">
        <div class="title">My First Upload</div>
        <div class="meta">532 views</div>
      </a>

    </div>

  </div>

</div>

</body>
</html>
