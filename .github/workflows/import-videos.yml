name: Import incoming videos

on:
  schedule:
    - cron: "*/8 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: import-incoming-videos
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Import manually downloaded MP4 files
        run: python3 scripts/import_videos.py

      - name: Commit imported videos, thumbnails, and Hot section
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add incoming videos thumbnails index.html
          if git diff --cached --quiet; then
            echo "No MP4 changes to commit"
          else
            git commit -m "Import manually downloaded videos and refresh Hot section"
            git push
          fi
