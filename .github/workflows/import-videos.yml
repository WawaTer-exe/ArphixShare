name: Import incoming videos

on:
  schedule:
    - cron: "*/8 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: import-incoming-videos
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install downloader
        run: python3 -m pip install --upgrade yt-dlp

      - name: Download authorized YouTube links
        run: python3 scripts/download_youtube_links.py

      - name: Import up to 20 incoming MP4 files
        run: python3 scripts/import_videos.py

      - name: Commit imported videos and Hot section
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add incoming videos index.html
          if git diff --cached --quiet; then
            echo "No video changes to commit"
          else
            git commit -m "Download incoming links and refresh Hot section"
            git push
          fi
